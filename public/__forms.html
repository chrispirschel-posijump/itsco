<!DOCTYPE html>
<!--
  Static form definition for Netlify Forms build-time detection.
  The live form is a React client component (components/ContactForm.tsx)
  that posts here. Netlify scans this file at build to register the form.
-->
<html>
  <head><title>Netlify form detection</title></head>
  <body>
    <form name="contact" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="company" />
      <input type="tel" name="phone" />
      <select name="topic">
        <option value="IT support">IT support</option>
        <option value="Security event or urgent issue">Security event or urgent issue</option>
        <option value="Consulting or strategy">Consulting or strategy</option>
        <option value="Partnership or vendor inquiry">Partnership or vendor inquiry</option>
        <option value="Other">Other</option>
      </select>
      <textarea name="message"></textarea>
      <input type="hidden" name="landing_page" />
      <input type="hidden" name="last_page" />
      <input type="hidden" name="referrer" />
      <input type="hidden" name="utm_source" />
      <input type="hidden" name="utm_medium" />
      <input type="hidden" name="utm_campaign" />
      <input type="hidden" name="utm_term" />
      <input type="hidden" name="utm_content" />
      <input type="text" name="bot-field" />
    </form>
    <form name="calculator" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="company" />
      <input type="text" name="industry" />
      <input type="text" name="current-it-model" />
      <input type="text" name="users" />
      <input type="text" name="devices" />
      <input type="text" name="mobile-devices" />
      <input type="text" name="servers" />
      <input type="text" name="network-devices" />
      <input type="text" name="addons-selected" />
      <input type="text" name="estimate-monthly" />
      <input type="text" name="estimate-annual" />
      <textarea name="summary"></textarea>
      <input type="text" name="bot-field" />
    </form>
  </body>
</html>
