<!DOCTYPE html>
<!--
  Static form definition for Netlify Forms build-time detection.
  The live form is a React client component (components/ContactForm.tsx)
  that posts here. Netlify scans this file at build to register the form.
-->
<html>
  <head><title>Netlify form detection</title></head>
  <body>
    <form name="contact" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="company" />
      <input type="tel" name="phone" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
    <form name="calculator" data-netlify="true" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="company" />
      <input type="text" name="industry" />
      <input type="text" name="current-it-model" />
      <input type="text" name="users" />
      <input type="text" name="devices" />
      <input type="text" name="mobile-devices" />
      <input type="text" name="servers" />
      <input type="text" name="network-devices" />
      <input type="text" name="addons-selected" />
      <input type="text" name="estimate-monthly" />
      <input type="text" name="estimate-annual" />
      <textarea name="summary"></textarea>
    </form>
  </body>
</html>
